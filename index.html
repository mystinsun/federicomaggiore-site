<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Federico Maggiore — Attore e doppiatore</title>
<meta name="description" content="Federico Maggiore, attore e doppiatore. Voce per spot, audiolibri, videogiochi e doppiaggio. Il nuovo sito è in arrivo.">
<link rel="canonical" href="https://federicomaggiore.it/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%234A1042'/%3E%3Ctext x='50' y='72' font-family='Georgia,serif' font-size='64' font-weight='700' fill='%23fff' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --bg: #130A28;
    --hero-bg: #170B30;
    --text: #F5F0FA;
    --text-mid: #B8ACCC;
    --text-light: #7E7298;
    --accent: #FFC24D;
    --hot: #F24E5A;
    --hot-hover: #E23A48;
    --display: 'Fraunces', Georgia, serif;
    --sans: 'Manrope', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0 }
  html { scroll-behavior: smooth }
  body {
    font-family: var(--sans); background: var(--hero-bg); color: var(--text);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 2rem; position: relative; overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  /* Aloni sfumati animati, come l'hero del nuovo sito */
  .glow { position: fixed; border-radius: 50%; filter: blur(70px); pointer-events: none; z-index: 0; will-change: transform, opacity }
  .glow-1 { width: 60vmin; height: 60vmin; top: 2%; right: 6%; background: radial-gradient(circle, rgba(140,81,166,.55) 0%, transparent 70%); animation: drift-a 20s ease-in-out infinite }
  .glow-2 { width: 52vmin; height: 52vmin; bottom: 2%; left: 4%; background: radial-gradient(circle, rgba(255,194,77,.28) 0%, transparent 70%); animation: drift-b 26s ease-in-out infinite }
  @keyframes drift-a { 0%,100% { transform: translate(0,0) scale(1); opacity: .5 } 50% { transform: translate(-7%,6%) scale(1.14); opacity: .68 } }
  @keyframes drift-b { 0%,100% { transform: translate(0,0) scale(1); opacity: .38 } 50% { transform: translate(6%,-5%) scale(1.12); opacity: .55 } }

  main { position: relative; z-index: 1; max-width: 640px }
  .photo { width: clamp(180px, 46vw, 240px); aspect-ratio: 1/1; margin: 0 auto 1.6rem; overflow: hidden; border: 1px solid rgba(255,255,255,.08); border-radius: 47% 53% 44% 56% / 58% 42% 58% 42%; animation: blobMorph 14s ease-in-out infinite, floaty 7s ease-in-out infinite }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: center }
  @keyframes blobMorph {
    0%, 100% { border-radius: 47% 53% 44% 56% / 58% 42% 58% 42% }
    33% { border-radius: 58% 42% 55% 45% / 45% 58% 42% 55% }
    66% { border-radius: 43% 57% 52% 48% / 55% 45% 57% 43% }
  }
  @keyframes floaty { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
  .name { font-family: var(--display); font-weight: 500; font-size: 1.5rem; color: #fff; letter-spacing: -.01em; margin-bottom: .5rem }
  .eyebrow { font-size: .76rem; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 1.4rem }
  h1 { font-family: var(--display); font-weight: 500; font-size: clamp(2.4rem, 7vw, 4.2rem); line-height: 1.1; letter-spacing: -.02em; color: #fff }
  .hl { font-style: italic; background: linear-gradient(100deg, var(--accent) 0%, var(--hot) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent }
  .lead { margin: 1.6rem auto 0; max-width: 34ch; font-size: 1rem; line-height: 1.7; color: var(--text-mid) }

  .actions { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; margin-top: 2.4rem }
  .btn-primary {
    display: inline-flex; align-items: center; gap: .6rem; background: var(--hot); color: #fff; text-decoration: none;
    padding: .95rem 2rem; border-radius: 50px; font-family: var(--display); font-size: 1.1rem; font-weight: 600;
    box-shadow: 0 10px 30px rgba(242,78,90,.4); transition: background .2s, transform .2s, box-shadow .2s;
  }
  .btn-primary:hover { background: var(--hot-hover); transform: translateY(-3px) scale(1.02); box-shadow: 0 16px 42px rgba(242,78,90,.5) }
  .btn-primary svg { width: 20px; height: 20px }
  .btn-ghost {
    display: inline-flex; align-items: center; gap: .5rem; color: var(--accent); text-decoration: none;
    padding: .95rem 1.6rem; border-radius: 50px; box-shadow: inset 0 0 0 1.5px var(--accent);
    font-size: .95rem; font-weight: 600; transition: background .2s, color .2s, transform .2s;
  }
  .btn-ghost:hover { background: var(--accent); color: var(--bg); transform: translateY(-3px) }

  .socials { display: flex; gap: 1.2rem; justify-content: center; margin-top: 2.6rem }
  .socials a { color: var(--text-light); transition: color .2s, transform .2s; display: flex }
  .socials a:hover { color: #fff; transform: translateY(-2px) }
  .socials svg { width: 22px; height: 22px }

  footer { position: relative; z-index: 1; margin-top: 3rem; font-size: .8rem; color: var(--text-light) }

  @media (prefers-reduced-motion: reduce) { .glow { animation: none } .photo { animation: none } }
</style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <main>
    <div class="photo"><img src="federico.jpg" alt="Federico Maggiore"></div>
    <p class="name">Federico Maggiore</p>
    <p class="eyebrow">Attore &middot; Doppiatore &middot; Speaker pubblicitario</p>
    <h1>Dai <span class="hl">voce</span> alle tue storie.</h1>
    <p class="lead">Il nuovo sito è in arrivo. Nel frattempo puoi ascoltare le mie ultime demo.</p>

    <div class="actions">
      <a class="btn-primary" href="https://www.bodalgo.com/it/speaker/federico-maggiore" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14l11-7z"/></svg>
        Ascolta le demo
      </a>
      <a class="btn-ghost" href="mailto:femaggio@gmail.com">Scrivimi</a>
    </div>

    <div class="socials">
      <a href="https://www.instagram.com/mystinsun" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/></svg></a>
      <a href="https://LinkedIn.com/in/federicomaggiore" target="_blank" rel="noopener" aria-label="LinkedIn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-4 0v7h-4v-7a6 6 0 016-6zM2 9h4v12H2zM4 6a2 2 0 100-4 2 2 0 000 4z"/></svg></a>
      <a href="https://youtube.it/mystinsun" target="_blank" rel="noopener" aria-label="YouTube"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 00-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 00-1.94 2A29 29 0 001 11.75a29 29 0 00.46 5.33A2.78 2.78 0 003.4 19.1c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 001.94-2 29 29 0 00.46-5.25 29 29 0 00-.46-5.43z"/><polygon points="9.75,15.02 15.5,11.75 9.75,8.48"/></svg></a>
    </div>
  </main>

  <footer>&copy; 2026 Federico Maggiore</footer>
</body>
